name: Uvoz zapisnikov

# Zapisniki MNZ Gorenjska se objavijo nekaj ur do nekaj dni po tekmi.
# Ker se tekme igrajo predvsem ob petkih, sobotah in nedeljah,
# na ta dneva pobiramo VSAKO URO (matches končane 17-19h → zapisnik
# tipično 20-22h, včasih zjutraj). Med tednom enkrat dnevno je dovolj.
# Uvoz je idempotenten: tekma z istim zapisnikom se posodobi, ne podvoji.
#
# ČLANI in MLADINCI sta dve ločeni ligi — vsaka ima svoje krogi, tekme,
# igralce in fantasy ekipe. Nekateri fantje igrajo v obeh ligah, a v naši
# bazi sta to dve različni player vrstici (players.competition_id), zato
# statistika ne uhaja med njima. Uvoz teče za obe zaporedno v istem jobu.
on:
  schedule:
    # Petek (5), Sobota (6), Nedelja (0) — vsako uro
    - cron: '0 * * * 5,6,0'
    # Ponedeljek do četrtek — enkrat, ob 5:00 UTC (7:00 po naše)
    - cron: '0 5 * * 1-4'
  workflow_dispatch:

concurrency:
  group: uvoz
  cancel-in-progress: false

jobs:
  uvoz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Predpomnilnik prihrani ponovno pobiranje že prebranih zapisnikov —
      # tako ob vsakem zagonu s strani MNZ potegnemo le nove tekme.
      - name: Predpomnilnik zapisnikov
        uses: actions/cache@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ github.run_id }}
          restore-keys: zapisniki-

      # === ČLANI (liga 1601) ==============================================
      # Šifra lige je v competitions.mnzg_liga, zato skripte tukaj --liga
      # ne potrebujejo — jo poberejo iz baze glede na --tekmovanje.
      - name: Člani — razpored
        run: node scripts/uvoz-razporeda.mjs --pisi
      - name: Člani — delegacije (roki)
        run: node scripts/uvoz-delegiranja.mjs --pisi
      - name: Člani — zapisniki
        run: node scripts/uvoz-zapisnikov.mjs
      - name: Člani — prestopi (poročilo)
        run: node scripts/uvoz-registracij.mjs
        continue-on-error: true
      - name: Člani — pozicije novincev
        run: node scripts/ugani-pozicije.mjs --pisi --samo-nove

      # === MLADINCI (liga 1603) ==========================================
      # Ista pipeline, drugačno tekmovanje. Nikoli ne prehaja med lig-ama —
      # players.competition_id loči igralca, klubi so si skupni.
      - name: Mladinci — razpored
        run: node scripts/uvoz-razporeda.mjs --tekmovanje mladinci --pisi
      - name: Mladinci — delegacije (roki)
        run: node scripts/uvoz-delegiranja.mjs --tekmovanje mladinci --pisi
      - name: Mladinci — zapisniki
        run: node scripts/uvoz-zapisnikov.mjs --tekmovanje mladinci
      - name: Mladinci — prestopi (poročilo)
        run: node scripts/uvoz-registracij.mjs --tekmovanje mladinci
        continue-on-error: true
      - name: Mladinci — pozicije novincev
        run: node scripts/ugani-pozicije.mjs --tekmovanje mladinci --pisi --samo-nove

      # === Skupno za obe ligi ============================================
      # Zdruzi duplikate: kljuc je `competition_id|full_name`, tako
      # nikoli ne pomesa mladinske vrstice s clansko — mladinec X in
      # clan X ostaneta locena, cetudi je oseba ista. Poganja se enkrat.
      - name: Združi duplikate (obe ligi)
        run: node scripts/zdruzi-duplikate.mjs --pisi
        continue-on-error: true
