name: Uvoz zapisnikov

# Zapisniki MNZ Gorenjska se objavijo nekaj ur do nekaj dni po tekmi.
# Ker se tekme 1. GNL igrajo predvsem ob petkih, sobotah in nedeljah,
# na ta dneva pobiramo VSAKO URO (matches končane 17-19h → zapisnik
# tipično 20-22h, včasih zjutraj). Med tednom enkrat dnevno je dovolj.
# Uvoz je idempotenten: tekma z istim zapisnikom se posodobi, ne podvoji.
on:
  schedule:
    # Petek (5), Sobota (6), Nedelja (0) — vsako uro
    - cron: '0 * * * 5,6,0'
    # Ponedeljek do četrtek — enkrat, ob 5:00 UTC (7:00 po naše)
    - cron: '0 5 * * 1-4'
  workflow_dispatch:
    inputs:
      liga:
        description: 'ID lige na mnzgkranj.si'
        required: false
        default: '1601'

concurrency:
  group: uvoz
  cancel-in-progress: false

jobs:
  uvoz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Predpomnilnik prihrani ponovno pobiranje že prebranih zapisnikov —
      # tako ob vsakem zagonu s strani MNZ potegnemo le nove tekme.
      - name: Predpomnilnik zapisnikov
        uses: actions/cache@v4
        with:
          path: scripts/.predpomnilnik
          key: zapisniki-${{ github.run_id }}
          restore-keys: zapisniki-

      - name: Razpored (novi ali prestavljeni krogi)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIGA: ${{ github.event.inputs.liga || '1601' }}
        run: node scripts/uvoz-razporeda.mjs --liga "$LIGA" --pisi

      # Delegacija pove tocne ure zacetka tekem — iz njih izracunamo rok kroga
      # (6 ur pred prvo tekmo). Delegacije za oddaljene kroge se ni, zato
      # skript samo tiho preskoci in poskusa naslednjic.
      - name: Delegacije (roki krogov)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIGA: ${{ github.event.inputs.liga || '1601' }}
        run: node scripts/uvoz-delegiranja.mjs --liga "$LIGA" --pisi

      - name: Zapisniki in točke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIGA: ${{ github.event.inputs.liga || '1601' }}
        run: node scripts/uvoz-zapisnikov.mjs --liga "$LIGA"

      # Samo porocilo: prestop se prepozna po imenu, kar pri soimenjakih lahko
      # zgresi. Ce se izkaze za zanesljivo, se doda --pisi.
      - name: Prestopi med klubi (porocilo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/uvoz-registracij.mjs
        continue-on-error: true

      # Le za igralce, ki pozicije še nimajo (novinci). Obstoječih ne premetava.
      - name: Pozicije novincev
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ugani-pozicije.mjs --pisi --samo-nove

      # Samodejno mergira "duplikat" igralce, ki so se pojavili z istim
      # imenom v drugem klubu (prestop). Le tam, kjer se casovnice NE
      # prekrivajo — soimenjake pusti pri miru in v izpisu opozori.
      - name: Zdruzi duplikate igralcev (prestopi)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/zdruzi-duplikate.mjs --pisi
        continue-on-error: true
